name: Release

# Publishes a release whenever the version in manifest.json changes (the tag is created by the release).
on:
  push:
    branches: [main]
    paths: ['manifest.json']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            theme.css
            manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release $VERSION already exists"; exit 0; fi
          gh release create "$VERSION" theme.css manifest.json --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Release $VERSION. Install from Obsidian's community themes."
